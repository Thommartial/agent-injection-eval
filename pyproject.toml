[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-injection-eval"
version = "0.1.0"
description = "Small prompt-injection test suite for a tool-using LLM agent"
authors = [{ name = "Thommartial" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["openai>=1.40", "pyyaml>=6.0", "pandas>=2.1", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
